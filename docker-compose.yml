services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shopzone
      POSTGRES_PASSWORD: shopzone
      POSTGRES_DB: user-db
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopzone -d user-db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
